<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lampa Wrapper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="viewer-body">
  <div id="loader" class="loader-overlay">
    <div class="loader-spinner"></div>
    <div id="statusText" class="loader-text">Запускаем локальную Lampa...</div>
  </div>

  <div id="errorBox" class="loader-overlay hidden">
    <div class="loader-text">Lampa не запустилась</div>
    <div id="errorText" class="url-label">Попробуй перезапуск</div>
    <div style="display:flex;gap:12px;">
      <button id="retryBtn">Повторить</button>
      <button id="restartBtn">Перезапустить app</button>
    </div>
  </div>

  <webview id="lampaWebview" class="webview hidden" allowpopups partition="persist:lampa"></webview>
  <webview id="youtubeWebview" class="webview hidden" allowpopups partition="persist:youtube"></webview>
  <webview id="kinopoiskWebview" class="webview hidden" allowpopups partition="persist:kinopoisk"></webview>

  <div id="startupHelp" class="startup-help" role="dialog" aria-modal="true" aria-labelledby="startupHelpTitle">
    <div class="startup-help-panel">
      <div class="startup-help-header">
        <div id="startupHelpTitle" class="startup-help-title">Горячие клавиши</div>
        <button id="startupHelpCloseBtn" class="startup-help-close" aria-label="Закрыть">×</button>
      </div>
      <div id="startupHelpList" class="startup-help-list" aria-label="Список горячих клавиш"></div>
      <button id="startupHelpOkBtn" class="startup-help-ok">Понятно</button>
    </div>
  </div>

  <div id="appMenu" class="app-menu hidden" aria-hidden="true">
    <div class="app-menu-panel" role="dialog" aria-modal="true">
      <div class="app-menu-grid" role="listbox" aria-label="Выбор приложения">
        <button class="app-menu-tile app-menu-item selected" data-app="lampa" role="option" aria-selected="true">
          <span class="app-menu-icon">L</span>
          <span class="app-menu-name">Lampa</span>
        </button>
        <button class="app-menu-tile app-menu-item" data-app="youtube" role="option" aria-selected="false">
          <span class="app-menu-icon app-menu-icon-youtube">▶</span>
          <span class="app-menu-name">YouTube</span>
        </button>
        <button class="app-menu-tile app-menu-item" data-app="kinopoisk" role="option" aria-selected="false">
          <span class="app-menu-icon app-menu-icon-kinopoisk">К</span>
          <span class="app-menu-name">Кинопоиск</span>
        </button>
        <button class="app-menu-tile app-menu-item" data-action="clear-cache" role="option" aria-selected="false">
          <span class="app-menu-icon app-menu-icon-cache">⌫</span>
          <span class="app-menu-name">Очистить кэш</span>
        </button>
      </div>
    </div>
  </div>

  <script src="shortcuts.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
